apiVersion: v1
kind: ConfigMap
metadata:
  name: operator-config
data:
  config.env: |
    maskinporten_api.authority_url=https://maskinporten.no
    maskinporten_api.self_service_url=https://api.samarbeid.digdir.no
    maskinporten_api.scope=idporten:dcr.altinn
    org_registry.url=https://altinncdn.no/orgs/altinn-orgs.json
    maskinporten_controller.requeue_after=24h
    maskinporten_controller.jwk_rotation_threshold=23d
    maskinporten_controller.jwk_expiry=30d
    keyvault_sync_controller.poll_interval=5m
    app_token_controller.token_lifetime=2h
    app_token_controller.refresh_lead_time=1h
    app_token_controller.key_version_grace=1h
    app_token_controller.audience=altinn-storage
    app_token_controller.issuer=altinn-studio-operator
    app_token_controller.key_name_prefix=app-token-signer-
